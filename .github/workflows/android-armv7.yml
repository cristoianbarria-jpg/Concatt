name: Build Android armv7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and setup Android NDK
        run: |
          ANDROID_NDK_VERSION=r25c
          echo "Descargando Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          echo "Descomprimiendo..."
          unzip -q android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "NDK configurado con éxito en la raíz."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: armv7-linux-androideabi

      - name: Install cargo tools
        run: cargo install cargo-ndk cargo-apk

      - name: Build dependencies (FFmpeg & sherpa-onnx)
        run: |
          chmod +x scripts/*.sh
          scripts/ffmpeg-mobile.sh armv7-linux-androideabi
          scripts/sherpa-mobile.sh armv7-linux-androideabi

      - name: Build APK
        run: |
          eval "$(scripts/mobile-env.sh armv7-linux-androideabi)"
          export ANDROID_NDK_HOME=$PWD/android-ndk-r25c
          cargo ndk -t armeabi-v7a --platform 26 build -p concat-android --release
          cargo apk build --release -p concat-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Concat-Android-armv7
          path: target/android/apk/release/*.apk
          

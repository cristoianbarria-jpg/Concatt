# BORRADOR SIN PROBAR. Va en .github/workflows/android-armv7.yml del fork.
# Supone que el proyecto vive en la carpeta src/ del repo (Cargo.toml,
# rust-toolchain.toml y scripts/ de ahí) y que los 3 scripts parcheados
# (ffmpeg-mobile.sh, sherpa-mobile.sh, mobile-env.sh) ya reemplazaron a los
# originales en src/scripts/.
name: Android armv7 (32 bits)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libclang-dev python3 pkg-config unzip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ya trae Android SDK y NDK: mobile-env.sh los usa por
      # ANDROID_NDK_HOME. Este paso solo muestra qué hay, para el diagnóstico.
      - name: Ver el NDK que trae el runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt"
          ls "$ANDROID_HOME/platforms"

      # Instala el toolchain que fija src/rust-toolchain.toml y agrega el target.
      - name: Rust
        run: |
          rustup toolchain install
          rustup target add armv7-linux-androideabi
          rustc --version

      - name: cargo-apk
        run: cargo install cargo-apk --locked

      - name: Caché de FFmpeg
        uses: actions/cache@v4
        with:
          path: src/vendor/ffmpeg/armv7-linux-androideabi
          key: ffmpeg-armv7-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}

      - name: FFmpeg para armv7
        run: |
          if [ ! -d vendor/ffmpeg/armv7-linux-androideabi/lib ]; then
            bash scripts/ffmpeg-mobile.sh armv7-linux-androideabi
          fi

      - name: sherpa-onnx para armv7
        run: bash scripts/sherpa-mobile.sh armv7-linux-androideabi

      # cargo-apk exige una llave para firmar el APK de release.
      - name: Llave temporal para firmar
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/armv7.keystore" \
            -storepass android -keypass android -alias key \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Concat armv7"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/armv7.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"

      # Ojo: skia-bindings no tiene binarios ya hechos para armv7 en el
      # rust-skia oficial, así que este paso puede compilar Skia desde cero
      # (lento: más de una hora es posible).
      - name: Compilar el APK
        run: |
          eval "$(bash scripts/mobile-env.sh armv7-linux-androideabi)"
          cargo apk build --release -p concat-android --target armv7-linux-androideabi

      - name: Dónde quedó el APK
        run: find target -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        with:
          name: Concat-android-armv7
          path: src/target/**/*.apk
          if-no-files-found: error
